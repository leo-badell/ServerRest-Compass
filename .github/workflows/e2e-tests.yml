name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar coleta dos testes
        run: pytest tests --collect-only -v

      - name: Executar testes E2E e gerar relatório
        run: |
          mkdir -p reports
          pytest tests -v --tb=short --json-report --json-report-file=reports/test_results.json

      - name: Publicar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/test_results.json
          retention-days: 15